<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gelik Config Tools</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <main class="home">
    <section class="home-header">
      <div>
        <h1>Gelik Config Tools</h1>
        <p data-i18n="homeDescription">Общие инструменты для редактирования конфигов модов DayZ.</p>
      </div>
      <button class="button classnames-button" type="button" data-open-classnames data-i18n="classnamesSettings">Настройка класснеймов</button>
    </section>

    <section class="editors-section">
      <h2 data-i18n="editors">Редакторы</h2>
      <div class="editor-cards">
        <a class="editor-card" href="modernstash/index.html">
          <img src="modernstash/preview.png" alt="ModernStash Config Editor preview">
          <span class="editor-card-body">
            <strong>ModernStash Config Editor</strong>
            <span data-i18n="modernstashCardText">Редактор JSON-конфига для Gelik ModernStash.</span>
          </span>
        </a>
        <a class="editor-card" href="randomgifts/index.html">
          <img src="randomgifts/preview.png" alt="RandomGifts Config Editor preview">
          <span class="editor-card-body">
            <strong>RandomGifts Config Editor</strong>
            <span data-i18n="randomgiftsCardText">Редактор JSON-конфига для Gelik RandomGifts.</span>
          </span>
        </a>
      </div>
    </section>
  </main>

  <script src="classnames-data.js"></script>
  <script src="i18n.js"></script>
  <script src="classnames-manager.js"></script>
</body>
</html>
